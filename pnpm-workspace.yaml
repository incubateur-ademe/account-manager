# pnpm 11 ne lit plus le champ "pnpm" de package.json : ses reglages vivent ici,
# meme hors monorepo. Voir https://pnpm.io/settings
#
# Les scripts d'installation sont bloques par defaut, et pnpm 11 attend une
# decision explicite pour chacun, la ou pnpm 10 se contentait d'une liste
# d'autorises. Un paquet laisse sans reponse fait echouer l'installation, donc
# toute commande pnpm : c'est voulu, un script d'installation execute par
# inadvertance est du code tiers lance sans qu'on l'ait decide.
allowBuilds:
  # Les moteurs Prisma et le binaire esbuild, dont tsx depend pour executer le
  # CLI de collecte : sans eux, rien ne tourne.
  '@prisma/engines': true
  esbuild: true
  prisma: true

  # Surveillance de fichiers en mode natif, pour le watch de vitest. Il existe un
  # repli en JavaScript pur, et aucune commande de ce depot n'en a besoin.
  '@parcel/watcher': false

# `@prisma/config` epingle deepmerge-ts en version exacte plutot qu'en plage : tant
# qu'il en designe une anterieure a la 8, rien de ce qu'on installe ne corrige
# CVE-2026-40345, l'epuisement de pile sur les graphes recursifs, et l'override reste
# le seul levier. Il devient inutile le jour ou ses dependances designent la 8 ou plus,
# ce qui se lit dans le lock. Cette version laisse intact l'export `deepmerge`, seule
# chose qu'il en tire pour fusionner la configuration.
# `prisma` embarque les pilotes de toutes les bases qu'il sait servir et epingle celui de
# MySQL en version exacte, laquelle porte une degradation d'authentification qui fuit des
# identifiants en clair vers un serveur malveillant. Ce depot parle a PostgreSQL par
# `@prisma/adapter-pg`, donc ce pilote n'est jamais charge et la faille n'est pas
# atteignable ici : cet override tait une alerte, il ne repare pas un risque. Il devient
# inutile le jour ou prisma releve sa propre broche, ce qui se lit dans le lock.
#
# Le plancher vise le second avis et pas le premier : deux failles distinctes ont ete
# publiees sur ce paquet, corrigees en 3.22.0 puis en 3.23.1. Viser la plus ancienne
# laisserait la resolution libre de choisir une 3.22.x encore faillible, et c'est le
# hasard qui reglerait la surete.
overrides:
  deepmerge-ts: ^8.0.0
  mysql2: ^3.23.1
