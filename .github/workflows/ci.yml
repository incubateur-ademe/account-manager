name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une exécution par référence : pousser deux fois de suite annule la première,
# qui n'apprendrait plus rien sur l'état courant.
# Le jeton ne sert qu'à lire le dépôt : aucun des deux jobs n'écrit, ne commente ni ne
# publie. Borné ici plutôt que par job, faute de quoi un job ajouté demain hériterait
# des permissions par défaut sans que personne ne le décide.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # L'étage unitaire, et tout ce qui se vérifie sans rien démarrer. Aucun service :
  # c'est la garantie que cet étage n'a besoin de rien, et elle se perdrait le jour où
  # une base traînerait à côté de lui.
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Le client Prisma est gitignoré : sans lui, le typecheck échoue sur des
      # modules absents plutôt que sur une vraie faute.
      - run: pnpm db:generate

      - run: pnpm verify

      # `pnpm verify` ne joue que la première passe, celle du schéma Zod. La seconde,
      # qui confronte le scope de chaque profil au schéma du connecteur visé, ne
      # tourne que dans cette commande : sans elle ici, un profil fautif commité
      # passerait la CI et ne se verrait qu'à l'octroi. La politique d'exemple est le
      # seul exemplaire versionné de ce que les instances écrivent, et la commande
      # attend les noms réels des fichiers, d'où la copie.
      - name: La politique d'exemple se charge, et ses profils se valident
        run: |
          mkdir -p "${RUNNER_TEMP}/politique"
          cp config/accounts.exemple.yaml "${RUNNER_TEMP}/politique/accounts.yaml"
          cp config/config.exemple.yaml "${RUNNER_TEMP}/politique/config.yaml"
          POLICY_DIR="${RUNNER_TEMP}/politique" pnpm policy:check

      # Les JSON Schema sont dérivés des schémas Zod et versionnés pour servir un
      # dépôt qui n'a pas le code sous la main. Commités périmés, ils font refuser par
      # l'éditeur ce que le démarrage accepte, ou l'inverse, et personne ne s'en
      # aperçoit avant d'écrire une politique.
      - name: Les JSON Schema commités sont ceux que la génération produit
        run: |
          pnpm policy:schema
          if ! git diff --exit-code -- config/accounts.schema.json config/config.schema.json; then
            echo "Les schémas versionnés ne suivent plus les schémas Zod : lancez pnpm policy:schema et commitez le résultat."
            exit 1
          fi

  # L'étage d'intégration, dans un job séparé plutôt qu'à la suite du premier. Les deux
  # échouent pour des raisons différentes, et un seul job les confondrait dans un même
  # rouge ; ils tournent en parallèle, donc la séparation ne coûte rien au temps
  # d'attente.
  integration:
    runs-on: ubuntu-latest

    services:
      # Même image que `docker-compose.yml`, pour que ce qui passe ici passe en local.
      # Les identifiants sont ceux du poste de développement et n'ouvrent rien : la
      # base naît avec le job et meurt avec lui. Elle s'appelle `account_manager_test`
      # parce que l'étage refuse toute base dont le nom ne le dit pas, et ce refus vaut
      # ici comme ailleurs.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: account_manager
          POSTGRES_PASSWORD: account_manager
          POSTGRES_DB: account_manager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U account_manager -d account_manager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      # Les deux commandes retombent sur la même adresse par défaut, celle que le
      # service expose. L'adresse est écrite deux fois dans `package.json` : les
      # changer ensemble, sinon les migrations partent sur une base et les scénarios
      # sur une autre, et les deux passent le garde-fou du suffixe sans protester.
      - run: pnpm db:deploy:test

      - run: pnpm test:integration
