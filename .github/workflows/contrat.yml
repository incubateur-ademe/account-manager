name: Contrats de connecteur

# Les API que ce dépôt lit n'ont ni versionnement, ni journal des changements, ni
# schéma publié : un champ qui disparaît ne se signale par aucune annonce. Ces tests
# tournent donc seuls, hors de la collecte, pour que la panne se voie avant qu'elle
# ne fasse passer des gens en poste pour partis.
#
# Un déclencheur `schedule` se désactive après soixante jours sans activité du dépôt.
# Le risque est accepté et nommé : un test de contrat qui cesse de tourner ne coupe
# l'accès de personne, contrairement à une collecte qui cesserait de tourner.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  contrat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ce job n'existe que pour tourner avec les secrets : un secret absent le rend
      # vert sans rien vérifier, ce qui est la panne qu'il est censé détecter chez
      # les autres.
      - name: Les secrets attendus sont présents
        env:
          NOTION_SCIM_TOKEN: ${{ secrets.NOTION_SCIM_TOKEN }}
        run: test -n "$NOTION_SCIM_TOKEN" || { echo "NOTION_SCIM_TOKEN absent des secrets du dépôt" >&2; exit 1; }

      # Un filtre qui ne matche plus rien sort aussi en vert : le compte de fichiers
      # attendus est le seul garde-fou contre un renommage silencieux.
      - name: Les tests de contrat existent
        run: test "$(ls src/connectors/*.contrat.test.ts | wc -l)" -ge 1

      - run: pnpm vitest run contrat.test
        env:
          NOTION_SCIM_TOKEN: ${{ secrets.NOTION_SCIM_TOKEN }}
