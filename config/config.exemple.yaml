# yaml-language-server: $schema=./config.schema.json

# Modele du fichier qui regle : seuils, vocabulaire, catalogues.
#
# Rien ici ne designe personne, et tout y a un defaut raisonnable : une instance qui
# ne fournirait pas ce fichier fonctionnerait quand meme, avec les valeurs ci-dessous.
# Il n'est donc pas sensible, mais il vit avec son jumeau pour que la politique reste
# d'un seul tenant.
#
# Toutes les entrees possibles y figurent, y compris celles qu'aucun code ne lit
# encore : un modele qui ne montre que le strict minimum n'apprend rien.

# Version du format, non du contenu. Elle existe pour qu'un fichier ecrit pour une
# autre version du code soit refuse net plutot que lu de travers.
version: 1

# Phases dans lesquelles une startup ne justifie plus aucun acces. La liste est ici et
# non dans le code : le vocabulaire de beta.gouv evolue, et decider qu'une phase est
# terminale est un choix metier. Une personne dont toutes les startups sont dans ces
# phases fait l'objet d'un constat, meme si sa mission court encore.
startups:
  terminalPhases:
    - abandon
    - abandon-investigation
    - transfere
    - alumni

thresholds:
  # Jours de report apres une echeance avant de considerer qu'il y a quelque chose a
  # faire. Un renouvellement signe en retard est la regle plutot que l'exception, et
  # couper le jour meme produirait surtout des remises en service.
  graceDays: 7

  # En deca, une echeance est annoncee comme proche, sur le tableau de bord comme sur
  # la fiche. Ce nombre est celui que l'interface ecrit en toutes lettres.
  soonDays: 30

  # Au-dela, une mission terminee releve de l'historique et non d'une action.
  staleDays: 180

  # Part du perimetre qu'une collecte peut perdre d'un coup avant de refuser d'en
  # tirer la moindre disparition et de se declarer partielle. Le perimetre arrive en
  # un seul appel : une reponse tronquee mais valide ferait sortir tout le monde a la
  # fois sans qu'aucune erreur ne soit levee, et l'offboarding suivrait.
  maxScopeDrop: 0.2

  # Part du perimetre qu'une collecte peut gagner d'un coup avant de refuser d'en
  # tirer la moindre arrivee. Meme appel unique, meme doute en sens inverse : une
  # source qui rend d'un coup un perimetre plus large ne se distingue pas d'une
  # arrivee collective, et constater une arrivee finit par ouvrir un dossier au nom
  # de quelqu'un.
  maxNewPersonShare: 0.2

  # Plafond de masse : nombre d'etapes qu'un plan peut faire executer d'un coup avant
  # d'exiger une confirmation explicite en plus de la sienne. Seul garde-fou conserve
  # a la place des approbateurs multiples, de la fenetre de retractation et du quorum.
  # Un plan anormalement gros est le plus souvent le signe d'un calcul qui a derape,
  # et le relire ligne a ligne coute moins que de le defaire.
  maxPlanSteps: 20

  # Age au-dela duquel les ecrans cessent d'affirmer et previennent que la collecte ne
  # tourne plus. Deux fois la periode du traitement quotidien : une nuit sautee arrive,
  # deux de suite est une panne.
  collectStaleHours: 48

# Reserve : catalogue des systemes couverts, avec leur criticite et le lien vers leur
# procedure. Aucun code ne le lit encore.
systems:
  - key: mon-systeme
    label: Mon systeme
    criticality: medium
    runbook: https://exemple.org/procedures/mon-systeme

# Ensembles d'acces qu'une arrivee ouvre d'un coup. Un profil est un role et ne nomme
# personne : c'est ce qui lui permet de vivre ici, dans le fichier qui ne designe
# personne, plutot qu'en base.
#
# Le scope d'un acces appartient au connecteur vise, qui seul sait le valider : ce
# fichier n'en verifie que la structure. Une faute de frappe dedans est signalee par
# `pnpm policy:check` et non au demarrage, faute de quoi elle arreterait la collecte
# nocturne de tout le parc au lieu du seul octroi qu'elle abime.
profiles:
  - key: developpeur
    label: Developpeur d'une startup d'Etat
    accesses:
      - system: github
        scope:
          organisation: incubateur-ademe
          role: member

      # Un connecteur dont l'octroi n'a pas de perimetre a choisir n'attend aucun
      # scope : etre membre du workspace, c'est tout ce qu'il y a a donner. La cle
      # s'omet donc, et c'est la forme que ce modele recommande. Une cle ecrite puis
      # laissee vide vaut la meme chose au chargement, mais la saisie assistee la
      # signale. Une cle en trop, elle, est refusee ici comme sur n'importe quel autre
      # systeme : dans un fichier ecrit a la main, c'est une faute de frappe.
      - system: notion

  - key: administration-github
    label: Administration de l'organisation GitHub
    accesses:
      - system: github
        scope:
          organisation: incubateur-ademe
          role: admin

        # Obligatoire ici et pas au-dessus : le connecteur tient le role admin pour un
        # acces eleve, et un acces eleve sans terme ne se referme jamais de lui-meme.
        # L'echeance se compte depuis l'ouverture du plan et jamais depuis la fin de
        # mission : prolonger une mission ne reconduit pas une administration, il faut
        # la redemander.
        expiresInDays: 180

# Reglages propres a chaque connecteur, sous sa cle. Chaque connecteur decide de la
# forme de la sienne et la valide lui-meme : une cle qu'aucun connecteur ne porte fait
# refuser le demarrage, plutot que de laisser croire a un reglage applique.
#
# Rien de secret n'a sa place ici : ce fichier est versionne et son contenu s'affiche
# dans l'interface. Les credentials vivent dans l'environnement.
#
# Omettre ce bloc revient exactement a ecrire ce qui suit.
connectors:
  github:
    # Organisations dont les comptes sont releves. En retirer une n'est pas anodin :
    # la collecte suivante datera la disparition des comptes qui n'y sont plus vus, et
    # l'offboarding suivra.
    organisations:
      - incubateur-ademe

# Reserve : ecarts admis pour de bon, qu'aucune collecte ne doit plus signaler. Un
# ecart tolere sans trace redevient un ecart oublie, d'ou la raison et le proprietaire
# obligatoires. Aucun code ne le lit encore.
permanentDerogations:
  - targetType: identite
    targetId: github:compte-partage
    reason: Compte de demonstration conserve a la demande de la direction
    owner: claire.durand
